name: Chromium UI acceptance and screenshots

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: preview
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: leadveyra_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preview -d leadveyra_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://preview:ci-test-password@127.0.0.1:5432/leadveyra_browser?schema=public
      DIRECT_URL: postgresql://preview:ci-test-password@127.0.0.1:5432/leadveyra_browser?schema=public
      APP_ADMIN_EMAIL: preview@example.test
      APP_ADMIN_PASSWORD: test-preview-password-at-least-sixteen
      AUTH_SESSION_SECRET: ci-only-not-production-this-secret-is-long
      APP_PREVIEW_ORG_SLUG: leadveyra-browser-ci
      APP_PREVIEW_ORG_NAME: Leadveyra Browser CI
      EMAIL_SENDING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: leadveyra-chromium-ubuntu2404-playwright-1.56.1
      - run: npm ci --no-fund
      - name: Install pinned Chromium browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Initialize isolated browser test database
        run: npx prisma db push
      - name: Build app
        run: npm run build
      - name: Run real Chromium interactions and screenshot baseline
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/leadveyra-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/leadveyra-browser.log' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          node scripts/browser-qa.mjs
          node scripts/route-browser-audit.mjs
      - name: Upload desktop and mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadveyra-browser-screenshots
          path: |
            browser-screenshots/
            browser-audit/
          if-no-files-found: ignore
          retention-days: 14
