name: Prepare reproducible npm lockfile
on:
  push:
    branches: [fix/leadveyra-lockfile-health-20261117]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile without running package install scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Commit lockfile to repair branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git commit -m "chore: lock npm dependencies for repeatable Hostinger builds"
          git push origin HEAD:refs/heads/fix/leadveyra-lockfile-health-20261117
